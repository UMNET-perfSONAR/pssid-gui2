x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# The one piece of the production hardening that costs a developer nothing.
# Blocking setuid/setgid escalation does not interfere with the watch toolchain,
# so there is no reason for the dev stack to run without it -- and having it here
# means `make security-check` against this stack does not report a difference
# that is not real. Deliberately NOT copied from production: pids_limit (the
# watchers legitimately spawn more processes) and cap_drop (the dev images are
# not the slim runtime ones).
x-dev-hardened: &dev-hardened
  security_opt:
    - no-new-privileges:true

services:
  client:
    <<: *dev-hardened
    image: pssid-gui2_client-dev:latest
    build:
      context: .
      dockerfile: services/client/Dockerfile
      # The dev stack runs the Vite dev server against mounted source, which
      # needs the full node_modules, so target the build stage (the production
      # compose uses the slim runtime stage and its own image tag).
      target: build
      args:
        VITE_EDITION: ${EDITION:-default}
    logging: *default-logging
    # Development stack: run the Vite dev server (hot reload) against the mounted
    # source, instead of the image's default static serving of the pre-built
    # bundle. node_modules comes from the image (built via npm ci), so no volume.
    command: npm run dev
    environment:
      # Selects the edition (see services/client/src/edition). Override by
      # setting EDITION=<id> in the root .env.
      - VITE_EDITION=${EDITION:-default}
    volumes:
      - ./services/client/src:/usr/src/app/client/src
      - ./shared:/usr/src/app/client/src/shared:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      internal:
        aliases:
          - client

  server:
    <<: *dev-hardened
    image: pssid-gui2_server-dev:latest
    restart: on-failure
    logging: *default-logging
    environment:
      # The auth posture, so a developer can open the dev stack for writes
      # without editing the tracked shared/config.ts. Both fall back to the
      # compiled defaults (SSO off, read-only) when unset in the root .env.
      - ENABLE_SSO=${ENABLE_SSO:-}
      - OPEN_WRITE=${OPEN_WRITE:-}
    build:
      context: .
      dockerfile: services/server/Dockerfile
      # The dev stack runs the watch toolchain (tsc -w + nodemon) against the
      # mounted source, which needs the full node_modules and the TypeScript
      # compiler, so target the build stage (the production compose uses the slim
      # runtime stage, which ships compiled output only).
      target: build
    # Deliberately NO bind mount of services/server/.env, unlike the production
    # compose. Two reasons, both of which bite on a developer's machine:
    #
    #  * That file is generated by install.sh and does not exist in a fresh
    #    checkout. Docker creates a DIRECTORY for a missing bind source, and a
    #    directory at that path then aborts install.sh at `: > "$SERVER_ENV"`
    #    with a bare "Is a directory" -- turning `make dev` into a booby trap for
    #    the later production install on the same checkout.
    #  * Where it does exist it holds the PRODUCTION settings, including a
    #    MongoDB URI with credentials. The dev mongo below runs without
    #    authentication, so importing that URI breaks the dev stack's database
    #    connection rather than helping it.
    #
    # Everything the dev server needs has a working default (see
    # database.service.ts for the Mongo URI); anything else is set through the
    # environment block above.
    volumes:
      - ./services/server/src:/usr/src/app/server/src
      - server_node_modules:/usr/src/app/server/node_modules
      - ./shared:/usr/src/app/server/src/shared:ro
    expose:
      - "8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      internal:
        aliases:
          - server

  mongo:
    <<: *dev-hardened
    image: pssid-gui2_mongo:latest
    build: ./services/database
    logging: *default-logging
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal
    volumes:
      - mongo_db:/data/db

  nginx:
    <<: *dev-hardened
    image: nginx:stable-alpine
    logging: *default-logging
    ports:
      - "8888:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      client:
        condition: service_healthy
      server:
        condition: service_healthy
    networks:
      - internal

volumes:
  server_node_modules:
  mongo_db:

networks:
  internal:
    driver: bridge
