name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN, workflow-wide. Without an explicit block the
# token's scopes come from the repository default, which can be read/write on
# every scope -- so a compromised dependency pulled in by any `npm ci` below
# would be handed a token that can push to this repo. Nothing here writes
# anything back: every job checks out, builds and asserts.
permissions:
  contents: read

jobs:
  server:
    name: Server (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/server/package-lock.json
      # The shared/ dir is mounted into the container at runtime; mirror it for CI.
      - name: Stage shared config
        run: mkdir -p src/shared && cp ../../shared/* src/shared/
      - run: npm ci
      - name: Typecheck (strict)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # Gating on the PRODUCTION tree only, and only at high/critical. What ships
      # in the image must stay clean, and both trees are clean today, so this
      # fails only on a genuine regression. The dev tree stays advisory below:
      # build and test tooling never reaches a deployment, and letting a CVE in
      # a transitive vite/vitest dependency block every merge would condition
      # reviewers to ignore the signal, which is how a genuine one gets missed.
      - name: Dependency audit (production deps, gating)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit (dev deps, advisory)
        run: npm audit --audit-level=high || true

  security:
    name: Security (config validation + secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # nginx is the only published entry point and its config is not exercised
      # by any unit test, so a typo in the hardening below ships as a container
      # that will not start. `nginx -t` is the only real check there is, and it
      # needs an nginx binary, so it runs here rather than on a developer's
      # machine. The committed nginx.conf AND all three installer renders are
      # checked: the installer overwrites the committed file on every run, so a
      # config that is valid only in the repo protects nobody.
      - name: Render the installer's nginx variants
        run: |
          set -euo pipefail
          mkdir -p /tmp/nginx-check /tmp/nginx-render
          # Extract just the nginx-rendering section of install.sh and drive its
          # generators directly, so all three TLS modes are checked without
          # running an actual install.
          START=$(grep -n '^# Host names this deployment answers to' install.sh | cut -d: -f1)
          END=$(grep -n '^# Back up any existing host-specific nginx.conf' install.sh | cut -d: -f1)
          {
            echo 'set -euo pipefail'
            echo 'HOSTNAME_INPUT=pssid.example.edu'
            sed -n "${START},$((END-1))p" install.sh
            echo 'gen_nginx_https /etc/nginx/certs/fullchain.pem /etc/nginx/certs/privkey.pem'
            echo 'cp nginx.conf /tmp/nginx-check/self-signed.conf'
            echo 'gen_nginx_https /etc/nginx/certs/live/h/fullchain.pem /etc/nginx/certs/live/h/privkey.pem hsts'
            echo 'cp nginx.conf /tmp/nginx-check/letsencrypt.conf'
            echo 'gen_nginx_http'
            echo 'cp nginx.conf /tmp/nginx-check/plain-http.conf'
          } > /tmp/gen-nginx.sh
          # Run in a scratch directory: the generators write ./nginx.conf, and the
          # committed one is checked separately below.
          (cd /tmp/nginx-render && bash /tmp/gen-nginx.sh)
          cp nginx.conf /tmp/nginx-check/committed.conf
          cp nginx.local.conf /tmp/nginx-check/local.conf
          ls -l /tmp/nginx-check

      # The certificate is generated HERE, on the runner, and mounted in.
      # nginx:stable-alpine ships no openssl binary, so generating it inside the
      # container fails with "openssl: not found" -- and because that failure is
      # easy to swallow, every TLS config then fails on a missing certificate and
      # the whole point of this job is lost while looking like a config error.
      - name: Generate a throwaway certificate for the config test
        run: |
          set -euo pipefail
          CERTS=/tmp/nginx-certs
          mkdir -p "$CERTS/live/h" "$CERTS/live/pssid.example.edu"
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout "$CERTS/privkey.pem" -out "$CERTS/fullchain.pem" -subj "/CN=nginx-config-test"
          for d in "$CERTS/live/h" "$CERTS/live/pssid.example.edu"; do
            cp "$CERTS/fullchain.pem" "$CERTS/privkey.pem" "$d/"
          done
          test "$(find "$CERTS" -name '*.pem' | wc -l)" = "6"

      - name: Validate every nginx config
        run: |
          docker run --rm \
            -v /tmp/nginx-check:/confs \
            -v /tmp/nginx-certs:/etc/nginx/certs \
            nginx:stable-alpine sh -c '
              # nginx resolves a literal proxy_pass hostname at CONFIG PARSE
              # time, so without these `nginx -t` fails with "host not found in
              # upstream" before it ever looks at the directives under test.
              printf "127.0.0.1 client\n127.0.0.1 server\n" >> /etc/hosts
              mkdir -p /var/www/certbot
              fail=0
              for f in /confs/*.conf; do
                echo "== nginx -t $f"
                nginx -t -c "$f" || fail=1
              done
              exit $fail
            '

      # Compose has to parse, and the hardening has to actually reach every
      # service. A YAML merge key that silently fails to apply looks identical to
      # one that worked, right up until a container escape uses the capability it
      # was supposed to drop.
      - name: Validate docker-compose and assert the hardening applies
        run: |
          set -euo pipefail
          # `docker compose config` both validates the file and resolves the YAML
          # anchors and merge keys, so what it prints is what would actually run.
          #
          # BOTH profiles are enabled deliberately. redis (sso) and backup are
          # profile-gated, and `config` omits a service whose profile is inactive
          # -- so without these flags the two would silently drop out of the
          # output and go unchecked. redis in particular holds every live session.
          docker compose -f docker-compose.yml --profile sso --profile backup config \
            > /tmp/compose-resolved.yml
          docker compose -f docker-compose.local.yml config > /dev/null
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 - <<'PY'
          import sys, yaml
          with open('/tmp/compose-resolved.yml') as fh:
              resolved = yaml.safe_load(fh)
          services = resolved.get('services', {})
          # Fail loudly rather than vacuously if the file ever stops listing these.
          expected = {'redis', 'client', 'server', 'mongo', 'nginx', 'certbot', 'backup'}
          assert expected <= set(services), f'missing services: {expected - set(services)}'
          problems = []
          for name, svc in services.items():
              if 'no-new-privileges:true' not in (svc.get('security_opt') or []):
                  problems.append(f'{name}: security_opt is missing no-new-privileges:true')
              if not svc.get('pids_limit'):
                  problems.append(f'{name}: pids_limit is not set')
              # Without this, code execution in a container becomes persistence.
              # Every service was verified to run read-only against a real stack;
              # the writable paths each one needs are tmpfs, declared per service.
              if not svc.get('read_only'):
                  problems.append(f'{name}: read_only is not set')
              if not svc.get('tmpfs'):
                  problems.append(f'{name}: read_only with no tmpfs (it will not start)')
          # client and server run unprivileged Node and need no capability at all.
          # The others' entrypoints drop privileges at startup, which requires some.
          for name in ('client', 'server'):
              if 'ALL' not in (services[name].get('cap_drop') or []):
                  problems.append(f'{name}: cap_drop must include ALL')
          if problems:
              print('Container hardening missing:')
              for p in problems:
                  print(' -', p)
              sys.exit(1)
          print(f'Container hardening present on all {len(services)} services.')
          PY

      # Nothing that holds a credential may be tracked. The .env files are
      # gitignored, but a `git add -f` or a rename past the ignore rule is a
      # single command, and the consequence is a client secret in the history
      # forever.
      - name: No secrets or certificates in version control
        run: |
          fail=0
          # -z and a null-delimited read: a path containing a space must not be
          # split into two harmless-looking fragments that match nothing.
          while IFS= read -r -d '' f; do
            case "$f" in
              # The documented template. It holds placeholders only, and the
              # secret-value scan below is what keeps it that way.
              services/server/.env.example) continue ;;
              *.env|.env|*/.env|*.env.*|*.pem|*.key|*.crt|*.p12|*.pfx)
                echo "TRACKED SECRET-BEARING FILE: $f"; fail=1 ;;
            esac
          done < <(git ls-files -z)
          # A real credential assigned in a committed file. The placeholders the
          # templates and tests legitimately contain are excluded by name, so
          # adding a new one is a deliberate act, not an accident.
          if grep -rInE '(CLIENT_SECRET|MONGO_PASSWORD|REDIS_PASSWORD|SECRET)=[A-Za-z0-9+/=_-]{12,}' \
               --include='*.yml' --include='*.yaml' --include='*.json' \
               --include='*.ts' --include='*.sh' --include='*.example' . \
               | grep -vE 'your-client-secret-here|replace-with-a|a-real-looking-client-secret-value'; then
            echo "A committed file appears to contain a real secret value (above)."
            fail=1
          fi
          exit $fail

      # The auth posture that SHIPS must be the safe one. An accidental commit of
      # a locally-toggled shared/config.ts is how a repository starts handing out
      # unauthenticated write access to everyone who deploys it.
      - name: Shipped defaults are the closed ones
        run: |
          fail=0
          grep -qE 'ENABLE_SSO:\s*false' shared/config.ts \
            || { echo 'shared/config.ts: ENABLE_SSO must ship false'; fail=1; }
          grep -qE 'OPEN_WRITE:\s*false' shared/config.ts \
            || { echo 'shared/config.ts: OPEN_WRITE must ship false (read-only)'; fail=1; }
          grep -q 'pssid.example' shared/config.ts \
            || { echo 'shared/config.ts: BASE_URL must ship a placeholder hostname'; fail=1; }
          exit $fail

  automation:
    name: Automation (ansible + shell syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ansible-core
        run: pipx install ansible-core || pip install ansible-core
      - name: Playbook syntax check
        working-directory: ansible
        run: |
          ansible-playbook --syntax-check site.yml
          ansible-playbook --syntax-check upgrade.yml
          ansible-playbook --syntax-check dev.yml
      - name: Shell script syntax check
        run: |
          bash -n bootstrap.sh install.sh
          for f in scripts/*.sh umich/QA/*.sh; do bash -n "$f"; done
      # ShellCheck catches what `bash -n` cannot: unquoted expansions, a `[ x = y ]`
      # that silently succeeds on an empty variable, a `local` that swallows an
      # exit status. These scripts run as root and write the deployment's
      # secrets, so a quoting slip there is a real fault, not style.
      - name: Shell lint (shellcheck)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning bootstrap.sh install.sh scripts/*.sh umich/QA/*.sh
      # Structural consistency that neither tests nor a syntax check can express:
      # links and operator-facing paths that survived a rename, Ansible vars files
      # whose NAME excludes them from ever loading, Makefile targets referenced
      # but never defined. Each of these has been a real fault here.
      - name: Repository consistency
        run: bash scripts/check-repo-consistency.sh

  smoke:
    name: End-to-end smoke (full stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # OPEN_WRITE through the ENVIRONMENT, not a written services/server/.env.
      #
      # The dev compose used to bind-mount that file, which meant CI had to
      # create it first so Docker would not materialize a DIRECTORY in its place
      # -- a workaround that quietly left the same trap for anyone running
      # `make dev` on a fresh checkout, where the resulting directory then aborts
      # install.sh. The mount is gone; the compose file reads OPEN_WRITE from the
      # environment instead, so this is now the same one-variable override an
      # operator uses on a prebuilt image.
      #
      # Set here rather than in the committed config: the shipped default is
      # read-only (shared/config.ts), and it must stay that way, but without an
      # override every create/update/delete check below would 403.
      - name: Build and start the dev stack
        env:
          OPEN_WRITE: "true"
        run: docker compose -f docker-compose.local.yml up -d --build
      # Wait for the stack to be STABLE, not merely to answer once.
      #
      # The dev stack runs tsc -w alongside nodemon, and tsc emits its output
      # file by file: on a cold start nodemon restarts the server dozens of times
      # (45 observed) before it settles. The first successful /api/health can
      # therefore land in the middle of that, and the suite below then runs
      # against a server that keeps disappearing -- nginx answers 502 and a
      # handful of checks fail for reasons that have nothing to do with the code.
      # Requiring consecutive successes waits out the restart storm instead.
      - name: Wait for the stack to become healthy and settle
        run: |
          need=5; streak=0
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8888/api/health >/dev/null 2>&1; then
              streak=$((streak+1))
              if [ "$streak" -ge "$need" ]; then
                echo "Healthy and stable ($need consecutive checks)."; exit 0
              fi
            else
              streak=0
            fi
            sleep 2
          done
          echo "Stack never became stably healthy"; exit 1
      - name: Run the end-to-end smoke suite (every user action)
        run: bash scripts/smoke-test.sh http://localhost:8888
      # The posture of the RUNNING stack, checked from the outside the way an
      # auditor would: security headers, Host handling, JSON-only API errors,
      # cross-origin write refusal, rate-limit headers, and container
      # privileges. Complements the `security` job, which reads configuration
      # files -- this one can only be answered by a live deployment.
      #
      # The script detects the dev stack from the running image tags and reports
      # production-only expectations (TLS policy, HSTS, the strict default
      # server) as notes rather than failures, so it is meaningful here without
      # standing up certificates. Warnings do not fail it; the two expected here
      # are "SSO disabled" and "OPEN_WRITE=true", both deliberate for CI.
      - name: Verify the running stack's security posture
        run: bash scripts/security-check.sh http://localhost:8888
      - name: Show container state and logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.local.yml ps
          docker compose -f docker-compose.local.yml logs --tail=200

  client:
    name: Client (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/client/package-lock.json
      - name: Stage shared config
        run: mkdir -p src/shared && cp ../../shared/* src/shared/
      - run: npm ci
      # Gating, not advisory: the production image compiles the bundle at build
      # time (`npm run build` = vue-tsc + vite build), so a type error fails the
      # image build. Catch it here first, on every PR, instead of on a VM.
      - name: Type check (strict, all sources incl. tests)
        run: npm run typecheck
      - name: Production build (same as the image)
        run: npm run build
      - name: Unit tests
        run: npm test
      # Gating on the PRODUCTION tree only, and only at high/critical. What ships
      # in the image must stay clean, and both trees are clean today, so this
      # fails only on a genuine regression. The dev tree stays advisory below:
      # build and test tooling never reaches a deployment, and letting a CVE in
      # a transitive vite/vitest dependency block every merge would condition
      # reviewers to ignore the signal, which is how a genuine one gets missed.
      - name: Dependency audit (production deps, gating)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit (dev deps, advisory)
        run: npm audit --audit-level=high || true

  # Container image vulnerability scan -- the layer `npm audit` and CodeQL cannot
  # see.
  #
  # Those two cover this repository's own JavaScript and its npm tree. Neither
  # knows anything about the OPERATING SYSTEM packages underneath: openssl, zlib,
  # glibc and the rest, inherited from node:22-slim, mongo, redis and nginx. A
  # base image that was clean when it was pinned accumulates CVEs without a line
  # of this project's code changing. This is the check a registry-side scanner
  # (Harbor/Trivy, Quay/Clair) performs on a pushed image.
  #
  # ADVISORY by default -- it reports, it does not block. Three of the five
  # images are third-party bases whose CVEs cannot be fixed here at all: the only
  # remedies are waiting for upstream or moving the pin, neither of which belongs
  # to the pull request that happens to be open. A gate that is red on day one
  # for reasons no author can act on is one everybody learns to ignore, which
  # costs more than it catches. Set GATE_ON_FINDINGS once the baseline is known
  # and deliberately accepted.
  #
  # A scan that FAILS TO RUN still fails the build. A scanner that reports
  # nothing because it never started is worse than no scanner, since it reads as
  # a clean result.
  image-scan:
    name: Container images (CVE scan)
    runs-on: ubuntu-latest
    env:
      # "true" makes fixable HIGH/CRITICAL findings blocking. See above.
      GATE_ON_FINDINGS: "false"
    steps:
      - uses: actions/checkout@v4

      # services/database/Dockerfile is a single FROM line, so its image is
      # byte-for-byte the upstream mongo tag; that tag is scanned directly below
      # rather than built here for nothing.
      - name: Build the images this deployment ships
        run: |
          docker build -f services/server/Dockerfile -t pssid-scan_server:ci .
          docker build -f services/client/Dockerfile -t pssid-scan_client:ci .

      # ONE trivy invocation per image, all sharing a single cache directory: the
      # vulnerability database is large and served from a rate-limited registry,
      # so downloading it per image is both slow and a common source of a job
      # that goes red for reasons unrelated to the code.
      #
      # trivy itself floats rather than being pinned, unlike every other image
      # here. A scanner pinned to an old release scans with old detection logic,
      # which is the one place staleness defeats the purpose -- and this image
      # only ever runs in CI, never in a deployment.
      - name: Scan
        run: |
          mkdir -p "$PWD/.trivycache" "$PWD/.trivyout"
          scan_failed=0
          findings=0
          summary=""

          # The third-party images compose runs are as much a part of the
          # deployment's attack surface as the two built above; nginx in
          # particular terminates TLS for every request.
          for img in pssid-scan_server:ci pssid-scan_client:ci \
                     mongo:8.0.17 redis:7 nginx:stable-alpine; do
            safe="$(printf '%s' "$img" | tr ':/' '__')"

            echo "::group::trivy: $img"
            # --exit-code 0 is deliberate. With it set to 1, "found a CVE" and
            # "the scanner could not run" are the same exit status, so a broken
            # invocation reads as a vulnerable image and the real fault stays
            # hidden. Findings are counted from the JSON below instead, which
            # leaves a non-zero exit meaning exactly one thing: the scan failed.
            # `|| rc=$?`, not a bare call followed by `rc=$?`. A run: block is
            # executed with `bash -e`, so a failing command at the top level
            # aborts the whole step immediately and the next line never runs --
            # the status would never be read, and the summary below never
            # printed. Inside a `||` list errexit does not fire.
            rc=0
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.trivycache:/root/.cache/trivy" \
              -v "$PWD/.trivyout:/out" \
              aquasec/trivy:latest image \
                --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
                --exit-code 0 --format json --output "/out/${safe}.json" "$img" \
              || rc=$?
            # Unconditional, and NOT after a `|| return`: a group left open on
            # failure collapses the error into it, which is precisely the output
            # someone needs to see when this step goes red.
            echo "::endgroup::"

            if [ "$rc" -ne 0 ] || [ ! -s "$PWD/.trivyout/${safe}.json" ]; then
              summary="${summary}  ERROR  ${img} -- trivy exited ${rc}, no report produced"$'\n'
              scan_failed=1
              continue
            fi

            # Same errexit reasoning: a malformed report must be reported, not
            # kill the step silently before the summary is printed.
            n="$(jq '[.Results[]?.Vulnerabilities // [] | length] | add // 0' "$PWD/.trivyout/${safe}.json" 2>/dev/null || echo unknown)"
            if [ "$n" = "unknown" ]; then
              summary="${summary}  ERROR  ${img} -- report produced but could not be parsed"$'\n'
              scan_failed=1
              continue
            fi
            findings=$((findings + n))
            if [ "$n" -eq 0 ]; then
              summary="${summary}  ok     ${img}"$'\n'
            else
              summary="${summary}  ${n} fixable HIGH/CRITICAL  ${img}"$'\n'
              echo "::group::details: $img"
              docker run --rm \
                -v /var/run/docker.sock:/var/run/docker.sock \
                -v "$PWD/.trivycache:/root/.cache/trivy" \
                aquasec/trivy:latest image \
                  --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
                  --exit-code 0 --format table "$img" || true
              echo "::endgroup::"
            fi
          done

          # Printed outside every group, so the result is legible without
          # expanding anything.
          echo ""
          echo "CVE summary (fixable HIGH/CRITICAL only)"
          printf '%s' "$summary"
          echo ""

          if [ "$scan_failed" -ne 0 ]; then
            echo "::error::Trivy could not scan one or more images. This is a broken check, not a vulnerability result -- see the ERROR lines above."
            exit 1
          fi

          if [ "$findings" -gt 0 ]; then
            if [ "$GATE_ON_FINDINGS" = "true" ]; then
              echo "::error::${findings} fixable HIGH/CRITICAL CVEs across the deployment images"
              exit 1
            fi
            echo "::warning::${findings} fixable HIGH/CRITICAL CVEs (advisory; set GATE_ON_FINDINGS to block)"
          fi
          exit 0
