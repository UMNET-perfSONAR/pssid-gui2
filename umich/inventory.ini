# Master Ansible inventory for the University of Michigan deployment of the
# pSSID GUI. This is the one file that names the real UMich controllers; every
# UMich-specific setting that goes with them lives in group_vars/ next to it,
# which Ansible loads automatically because it sits beside this inventory.
#
# Run it from the ansible/ directory so the roles and ansible.cfg are found:
#
#   cd ansible
#   ansible-playbook -i ../umich/inventory.ini site.yml
#   ansible-playbook -i ../umich/inventory.ini upgrade.yml
#
# The playbook needs root on the target: either ansible_user=root as below, or a
# sudo-capable user plus --ask-become-pass.
#
# Every host below is named by its FULL domain name, and that name is also the
# hostname the deployment serves: group_vars/pssid_gui.yml resolves
# pssid_gui_hostname from inventory_hostname, so each VM gets its own nginx
# server_name, BASE_URL and TLS certificate with nothing to keep in step by hand.
# A short name would not do -- it is what DNS resolves and what the certificate
# is issued for.
#
# One command deploys all of them. To act on a single VM, limit the run:
#
#   cd ansible
#   ansible-playbook -i ../umich/inventory.ini site.yml \
#     --limit pssid-gui-qa7.miserver.it.umich.edu
#
# or, from the repository root, `make deploy-umich ANSIBLE_ARGS="--limit <fqdn>"`.
#
# Add a production controller as a further line in the same group when it exists.

[pssid_gui]
# Development controller.
pssid-web-dev.miserver.it.umich.edu ansible_user=root

# QA controllers. Same settings as the dev host (UMich edition, SSO off, writes
# open, nightly backups); they differ only in the hostname each one serves.
pssid-gui-qa5.miserver.it.umich.edu ansible_user=root
pssid-gui-qa6.miserver.it.umich.edu ansible_user=root
pssid-gui-qa7.miserver.it.umich.edu ansible_user=root
