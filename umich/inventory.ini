# Master Ansible inventory for the University of Michigan deployment of the
# pSSID GUI. This is the one file that names the real UMich controllers; every
# UMich-specific setting that goes with them lives in group_vars/ next to it,
# which Ansible loads automatically because it sits beside this inventory.
#
# Run it from the ansible/ directory so the roles and ansible.cfg are found:
#
#   cd ansible
#   ansible-playbook -i ../umich/inventory.ini site.yml
#   ansible-playbook -i ../umich/inventory.ini upgrade.yml
#
# The playbook needs root on the target: either ansible_user=root as below, or a
# sudo-capable user plus --ask-become-pass.
#
# Every host below is named by its FULL domain name, and that name is also the
# hostname the deployment serves: group_vars/pssid_gui.yml resolves
# pssid_gui_hostname from inventory_hostname, so each VM gets its own nginx
# server_name, BASE_URL and TLS certificate with nothing to keep in step by hand.
# A short name would not do -- it is what DNS resolves and what the certificate
# is issued for.
#
# One command deploys all of them. To act on a single VM, limit the run:
#
#   cd ansible
#   ansible-playbook -i ../umich/inventory.ini site.yml \
#     --limit pssid-gui-qa7.miserver.it.umich.edu
#
# or, from the repository root, `make deploy-umich ANSIBLE_ARGS="--limit <fqdn>"`.
#
# Add a production controller as a further line in the same group when it exists.

# SSO is set PER HOST here rather than in group_vars, because it only works on a
# host whose sign-in redirect URI is registered in the Okta application
# ("ITS - pssid development"). A host that is not registered reaches Okta and is
# refused with "redirect_uri did not match", so a group-wide switch would break
# precisely the hosts it cannot help.
#
# ITS registered four URIs. To add a host to SSO, ask them to add
# https://<fqdn>/callback as a sign-in URI and https://<fqdn> as a sign-out URI
# (no path, no trailing slash), then set pssid_gui_sso=true on its line.

[pssid_gui]
# Development controller. SSO registered.
pssid-web-dev.miserver.it.umich.edu ansible_user=root pssid_gui_sso=true

# QA controllers with a registered redirect URI.
pssid-gui-qa5.miserver.it.umich.edu ansible_user=root pssid_gui_sso=true
pssid-gui-qa6.miserver.it.umich.edu ansible_user=root pssid_gui_sso=true
pssid-gui-qa8.miserver.it.umich.edu ansible_user=root pssid_gui_sso=true

# QA controller WITHOUT a registered redirect URI. Commented out rather than
# deployed with SSO off: leaving it active would deploy a read-only site to a
# host nobody can sign in to, which looks like a broken deployment rather than an
# unfinished registration.
#
# Either ask ITS to add its URI to the application and move it up with
# pssid_gui_sso=true, or delete this line if the host is gone. It was named as
# a live controller before the Okta registration listed qa6 and qa8; qa5 has
# since been registered and moved up above, so it is worth confirming qa7 the
# same way.
# pssid-gui-qa7.miserver.it.umich.edu ansible_user=root
