---
# UMich-specific deployment settings for every host in the [pssid_gui] group of
# ../inventory.ini. Ansible loads this file automatically when that inventory is
# used, so the deployment command carries no -e flags and nothing about the
# UMich install lives outside this folder.
#
# Every variable here is one of the generic ones documented in
# ../../ansible/group_vars/all.yml and defined in
# ../../ansible/roles/pssid_webgui/defaults/main.yml. This file only supplies
# UMich values for them; it never introduces a UMich-only variable, so the
# vendor-neutral code path stays the only code path.

# Navy/maize interface. See ../../services/client/src/edition/editions.ts.
pssid_gui_edition: umich

# Public hostname users visit. Must match the DNS name and, once SSO is on, the
# redirect URIs registered with ITS in Okta, or sign-in fails.
#
# Each host is named by its own FQDN in ../inventory.ini, and that name IS the
# hostname it serves, so this resolves per host rather than pinning one literal.
# A literal here would apply to EVERY host in the group -- the installer would
# write another machine's name into nginx's server_name and BASE_URL, and that
# host would then answer 444 to its own address (nginx refuses a Host it does
# not serve) while redirecting anyone who did reach it to a different VM.
#
# inventory_hostname rather than the role's ansible_fqdn default: this is the
# name an operator typed and can see, not whatever `hostname -f` happens to
# report on a VM whose /etc/hosts is incomplete.
pssid_gui_hostname: "{{ inventory_hostname }}"

# Okta single sign-on through the ITS tenant.
#
# Pinned OFF while ITS is still registering the Okta application. There are no
# client credentials yet, and `true` without them makes the server refuse to
# boot, so this asserts the unauthenticated posture on every run rather than
# leaving it to whatever the host happens to have. (Empty would mean "do not
# change this host's posture", which is not the same guarantee: a host somebody
# had experimented with would keep its old setting.)
#
# When ITS returns the application: put the id and secret in the vault file
# (../README.md), set this to true, and deploy. `make sso-on` on the host is the
# way to try it before committing the change here.
pssid_gui_sso: "false"

# ─── The four values ITS returns ────────────────────────────────────────────
#
# Everything needed to turn SSO on lives here or in the vault. Nothing else
# about the deployment changes. See ../README.md#turning-sso-on for the order.
#
# 1. Issuer. Already set, because it is the tenant, not a per-app value. Change
#    it only if ITS gives a CUSTOM authorization server (a URL with an
#    /oauth2/... path) -- the groups claim then has to be configured on that
#    server rather than the org one, which is worth confirming with them.
pssid_gui_oidc_issuer: https://umich.okta.com

# 2 & 3. Client id and secret do NOT belong in this file -- it is committed.
#    They go in an encrypted vault, which .gitignore keeps untracked:
#      ansible-vault create ../umich/group_vars/all/vault.yml
#    holding pssid_gui_oidc_client_id and pssid_gui_oidc_client_secret.
#
# 4. The group -> permission mapping. Fill in the two strings EXACTLY as they
#    appear in the token (Okta's Token Preview shows them), not the groups'
#    display names: the match folds case and trims whitespace but is otherwise
#    literal, so `pssid-gui` will not also match `pssid-gui-readonly`.
#
#    This is set here rather than edited into shared/auth-groups.config.json on
#    each host: the role discards deploy-time edits to tracked files before it
#    pulls, so a hand edit would survive until the next upgrade and then revert
#    to the shipped placeholders -- denying every user on a site that had been
#    working. Set here, all four controllers get the same mapping every run.
#
# pssid_gui_auth_groups:
#   <write-group-string-from-ITS>: write
#   <read-group-string-from-ITS>: read

# Write access WHILE SSO IS OFF. True, because with no identity provider yet
# this is the only thing that keeps the interface usable: with it false every
# form is greyed out and every save returns 403, which is a read-only demo
# rather than a working controller.
#
# The tradeoff is explicit and temporary: anyone who can reach the hostname can
# change the probe configuration, so the site's access control is currently the
# network in front of it. Setting pssid_gui_sso to true above makes this
# setting irrelevant -- with SSO on, group membership decides read vs write
# (see ../../shared/auth-groups.config.json) and this is never consulted.
pssid_gui_open_write: "true"

# MiServer VMs have a small /var/lib partition; put Docker and containerd on the
# roomier volume so an image build does not fill the root filesystem.
pssid_gui_docker_data_root: /usr/local/miserver/docker

# Trusted certificate from Let's Encrypt (needs ports 80 and 443 reachable).
# Switch to self-signed if the firewall does not allow the HTTP-01 challenge.
pssid_gui_tls: letsencrypt
pssid_gui_letsencrypt_email: pssid-admins@umich.edu

# Nightly database backup at 03:15, keeping two weeks of archives.
pssid_gui_backup_cron: true
pssid_gui_backup_hour: "3"
pssid_gui_backup_minute: "15"
pssid_gui_backup_retention_days: 14
