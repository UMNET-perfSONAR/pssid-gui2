---
# UMich-specific deployment settings for every host in the [pssid_gui] group of
# ../inventory.ini. Ansible loads this file automatically when that inventory is
# used, so the deployment command carries no -e flags and nothing about the
# UMich install lives outside this folder.
#
# Every variable here is one of the generic ones documented in
# ../../ansible/group_vars/all.yml and defined in
# ../../ansible/roles/pssid_webgui/defaults/main.yml. This file only supplies
# UMich values for them; it never introduces a UMich-only variable, so the
# vendor-neutral code path stays the only code path.

# Navy/maize interface. See ../../services/client/src/edition/editions.ts.
pssid_gui_edition: umich

# Public hostname users visit. Must match the DNS name and, once SSO is on, the
# redirect URIs registered with ITS in Okta, or sign-in fails.
#
# Each host is named by its own FQDN in ../inventory.ini, and that name IS the
# hostname it serves, so this resolves per host rather than pinning one literal.
# A literal here would apply to EVERY host in the group -- the installer would
# write another machine's name into nginx's server_name and BASE_URL, and that
# host would then answer 444 to its own address (nginx refuses a Host it does
# not serve) while redirecting anyone who did reach it to a different VM.
#
# inventory_hostname rather than the role's ansible_fqdn default: this is the
# name an operator typed and can see, not whatever `hostname -f` happens to
# report on a VM whose /etc/hosts is incomplete.
pssid_gui_hostname: "{{ inventory_hostname }}"

# Okta single sign-on through the ITS tenant.
#
# Set PER HOST in ../inventory.ini, not here, because SSO only works on a host
# whose redirect URI is registered in the Okta application. ITS registered three
# (dev, qa6, qa8); a host not on that list would reach Okta and be turned away
# with "redirect_uri did not match", so switching it on for the whole group would
# break exactly the hosts it could not help.
#
# Empty here therefore means "each host decides", and the inventory says which.
# `make sso-on` / `make sso-off` on a host still work for trying it before
# committing a change.
pssid_gui_sso: ""

# Client id of the "ITS - pssid development" OIDC application.
#
# Committed deliberately. A client id is not a credential: it travels in the
# browser's URL bar on every sign-in, and the OIDC threat model assumes the
# attacker has it. Keeping it here rather than in the vault means the deployment
# needs the vault for exactly one value -- the secret -- so there is no doubt
# about what actually has to be protected.
pssid_gui_oidc_client_id: 0oa25hltopzoZr4XR1d8

# Issuer: the CUSTOM authorization server this application is registered on.
#
# Taken from the application's own record in AMP, which prints the endpoint under
# "Okta OIDC Configuration":
#   https://okta.umich.edu/oauth2/default/.well-known/openid-configuration
# The /oauth2/default path is what makes this a custom authorization server
# rather than the org one, and the two are NOT interchangeable.
#
# Two earlier values were wrong, both instructively:
#
#   umich.okta.com          -- the vendor's default naming, not this tenant. An
#                              unrelated host that nonetheless resolves, so it
#                              failed at sign-in rather than in DNS.
#   okta.umich.edu          -- the right tenant, wrong server. The ORG server
#                              knows nothing of this application's configuration:
#                              it defines no custom scopes (so `edumember` came
#                              back invalid_scope) and carries none of the claim
#                              release configured in AMP (so every sign-in
#                              succeeded with an EMPTY group list and was then
#                              denied). One wrong path, both symptoms.
#
# The lesson worth keeping: an issuer that authenticates users correctly is not
# thereby the right issuer. Take it from the application's record, not from the
# tenant hostname.
#
# A wrong value here does NOT stop the server booting. express-openid-connect
# discovers lazily, on the first request that needs the provider (lib/context.js),
# so the deployment comes up healthy and fails at sign-in instead. Verify it
# directly rather than inferring it from a successful deploy:
#   curl -s https://okta.umich.edu/oauth2/default/.well-known/openid-configuration \
#     | grep -o '"issuer":"[^"]*"'
pssid_gui_oidc_issuer: https://okta.umich.edu/oauth2/default

# Scope requested at sign-in.
#
# Standard scopes only, for now. `edumember` was here originally and produced
#   invalid_scope (Custom scopes are not allowed for this request.)
# but that was against the ORG authorization server, which defines no custom
# scopes -- not evidence about the custom server the application is actually
# registered on (see pssid_gui_oidc_issuer above). Whether `edumember` is valid
# there is a separate question, and answerable directly:
#
#   curl -s https://okta.umich.edu/oauth2/default/.well-known/openid-configuration \
#     | grep -o '"scopes_supported":\[[^]]*\]'
#
# Add it back only if that list contains it. AMP releases the groups through the
# `edumember_ismemberof` claim (Attribute Release: "These groups will be released
# in the edumember_ismemberof claim"), and on a custom authorization server a
# claim may be emitted unconditionally or gated behind a scope -- the two are
# configured separately, so the claim existing says nothing about whether a scope
# is needed to receive it.
#
# The test that settles it either way: sign in and read /api/userinfo, where
# `groups` must contain pssid-gui-users. An empty list there with a valid
# sign-in means the claim did not arrive, not that the user lacks membership.
pssid_gui_sso_scope: "openid profile email"

# Group -> permission mapping.
#
# ITS releases exactly ONE group, `pssid-gui-users` (AMP: Attribute Release), so
# there is no read-only tier to map: this single group is every person who can
# sign in at all, and it must grant WRITE or the deployment authenticates
# everyone into an interface where every form is greyed out and every save is
# refused -- which is not a safer configuration, just a broken one.
#
# The consequence, stated plainly: anyone in pssid-gui-users can change the probe
# configuration. Membership of that MCommunity group IS the access control. To
# separate operators from viewers later, ask ITS to release a second group and
# map it to `read` here.
#
# Set here rather than edited into shared/auth-groups.config.json on each host:
# the role discards deploy-time edits to tracked files before it pulls, so a hand
# edit would survive until the next upgrade and then revert to the shipped
# placeholders -- denying every user on a site that had been working.
#
# The string is what appears in the CLAIM, not a display name. Matching folds
# case and trims whitespace but is otherwise exact, with no prefix matching.
pssid_gui_auth_groups:
  pssid-gui-users: write

# Write access WHILE SSO IS OFF. Never consulted on a host with SSO on -- group
# membership decides there -- so this now governs only the hosts whose redirect
# URI ITS has not registered.
#
# FALSE, now that SSO exists. It was true while there was no identity provider,
# because the alternative was a read-only demo; that justification is gone for
# any host that can authenticate, and leaving it true would mean an
# unauthenticated writable site the moment anyone ran `make sso-off`.
#
# A consequence worth knowing: an unregistered host (see ../inventory.ini) is now
# read-only. That is the correct default -- it cannot authenticate anyone, so the
# only alternative is anonymous write access -- but it means editing on such a
# host needs `make writes-on` deliberately, or its redirect URI registered.
pssid_gui_open_write: "false"

# MiServer VMs have a small /var/lib partition; put Docker and containerd on the
# roomier volume so an image build does not fill the root filesystem.
pssid_gui_docker_data_root: /usr/local/miserver/docker

# Trusted certificate from Let's Encrypt (needs ports 80 and 443 reachable).
# Switch to self-signed if the firewall does not allow the HTTP-01 challenge.
pssid_gui_tls: letsencrypt
pssid_gui_letsencrypt_email: pssid-admins@umich.edu

# Nightly database backup at 03:15, keeping two weeks of archives.
pssid_gui_backup_cron: true
pssid_gui_backup_hour: "3"
pssid_gui_backup_minute: "15"
pssid_gui_backup_retention_days: 14
