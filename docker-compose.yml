# Cap container logs so they can never fill the disk (a common unattended-host
# failure). Applied to every service via the *default-logging anchor.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Container-runtime hardening applied to EVERY service via the *hardened anchor.
#
# `no-new-privileges` blocks the setuid/setgid escalation path outright: a process
# in the container cannot gain privileges it did not start with, so a setuid
# binary that finds its way into an image (or a base image update that adds one)
# is inert. It is safe for every service here because none of them escalate
# deliberately -- the entrypoints that do change user, mongo's and redis's, drop
# privileges rather than gain them, which this does not prevent.
#
# `pids_limit` bounds fork-bomb behaviour, deliberate or accidental (a runaway
# provisioning loop), so one container cannot exhaust the host's process table
# and take the other services down with it. 1024 rather than something tighter
# because the cgroup pids controller counts THREADS, not just processes: Node
# runs a small thread pool and MongoDB allocates a thread per connection, so a
# few hundred is normal operation for this stack, not abuse.
#
# `read_only` is applied per service rather than here, because each one needs a
# different set of writable tmpfs paths and getting that set wrong stops the
# container starting. Every path below was determined by running the stack, not
# by reading documentation. The point of a read-only root is that code execution
# in a container does not become persistence: an attacker cannot drop a payload,
# replace application files, or leave anything behind a restart. The tmpfs mounts
# are the deliberate exceptions, and they are `noexec,nosuid` and size-capped so
# they cannot be used to stage a binary or fill the host's memory.
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  pids_limit: 1024

services:
  redis:
    <<: *hardened
    # /data is the volume below; nothing else is written.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    image: redis:7
    profiles:
      - sso
    container_name: redis
    # Internal only: the server reaches redis over the Docker network, and
    # nothing on the host needs it, so it is never published. It ALSO requires a
    # password, because with SSO on this holds the session store, so anything that
    # reaches it could read or forge logged-in sessions, and network isolation
    # should not be the only thing standing in the way.
    # The check is made at RUNTIME, not through compose interpolation: this
    # service is profile-gated to `sso`, but compose interpolates the whole file
    # either way, so a `${VAR:?}` here would break every non-SSO deployment,
    # which needs no Redis at all. Failing in the container instead means the
    # requirement lands only when Redis is actually started, and it fails with an
    # explicit error rather than silently starting an unauthenticated instance.
    command:
      - sh
      - -c
      - |
        test -n "$$REDISCLI_AUTH" || {
          echo "REDIS_PASSWORD is empty: refusing to start Redis without authentication. Run ./install.sh to generate one." >&2
          exit 1
        }
        exec redis-server --requirepass "$$REDISCLI_AUTH"
    expose:
      - "6379"
    environment:
      # Doubles as the server password and the credential redis-cli reads on its
      # own, so the healthcheck below authenticates without putting a password on
      # a command line.
      - REDISCLI_AUTH=${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      # Match on PONG rather than the exit code: redis-cli exits 0 even when the
      # server answers "NOAUTH Authentication required", so a bare `ping` would
      # report healthy on a container nothing can actually authenticate to.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal
  client:
    <<: *hardened
    # This image only reads a pre-built static bundle off disk and answers HTTP on
    # an unprivileged port, so it needs no Linux capabilities at all. Dropping
    # them removes the whole class of container escape that starts from one.
    cap_drop:
      - ALL
    # Nothing is ever written: the bundle is baked into the image and served
    # as-is. A read-only root means the pages this serves cannot be rewritten by
    # anything that gets execution inside the container.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    # PSSID_IMAGE_PREFIX/PSSID_IMAGE_TAG let a deployment pull prebuilt images
    # from a registry (install.sh --pull) instead of building on the VM; the
    # defaults keep the local build-from-source names unchanged. The client has
    # its own tag override because the published client image is per edition
    # (:latest = default edition; a branded edition is published under its own
    # tag, because the brand is baked into the bundle at build time).
    image: ${PSSID_IMAGE_PREFIX:-pssid-gui2}_client:${PSSID_CLIENT_TAG:-${PSSID_IMAGE_TAG:-latest}}
    # Built from the repo ROOT so the image can bundle both the client app and
    # the shared/ config at build time (see services/client/Dockerfile). The
    # production bundle is compiled once here, not per container start, so the
    # container starts in seconds and a broken build fails at `compose build`
    # (before any container starts) instead of on a live VM.
    build:
      context: .
      dockerfile: services/client/Dockerfile
      args:
        # Edition (brand) is inlined into the bundle at build time. Set EDITION
        # in the root .env; the installer and Makefile manage this.
        VITE_EDITION: ${EDITION:-default}
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "8080"
    healthcheck:
      # The image serves a pre-built static bundle, so it is ready in seconds.
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      internal:
        aliases:
          - client

  server:
    <<: *hardened
    # Node listening on an unprivileged port, reading and writing bind-mounted
    # files as its own uid. No capability is required for any of that; the
    # supplementary gid below (group_add) is how it reads the secret file, and
    # that is a group membership, not a capability.
    cap_drop:
      - ALL
    # Everything this process writes goes to a bind mount (bin, plugins, output),
    # which stays writable under a read-only root. The entrypoint's `mkdir -p` on
    # those paths is a no-op because the image already created them, and its
    # `npm install` branch is skipped when NODE_ENV=production, which the runtime
    # stage sets -- so nothing touches the image's own filesystem at start.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    image: ${PSSID_IMAGE_PREFIX:-pssid-gui2}_server:${PSSID_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    build:
      context: .
      dockerfile: services/server/Dockerfile
      # Compiled JavaScript, production dependencies only, non-root (the local
      # stack targets the `build` stage for the watch toolchain instead).
      target: runtime
    environment:
      # Authenticated: see the redis service above. Compose wins over the value
      # in services/server/.env, since dotenv does not override a set variable.
      # Authenticated; see the redis service. Only used when SSO is on (the
      # server connects to Redis nowhere else), so an empty value on a non-SSO
      # deployment is harmless. Compose wins over services/server/.env, because
      # dotenv does not override an already-set variable.
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379
      # Auth posture. Both default to the values compiled into shared/config.ts
      # and can be overridden here without rebuilding the image, which is what
      # makes a prebuilt (--pull) image usable for an SSO deployment.
      - ENABLE_SSO=${ENABLE_SSO:-}
      - OPEN_WRITE=${OPEN_WRITE:-}
    # services/server/.env carries the MongoDB password, the session secret and
    # the OIDC client secret. It is root-owned 0640 on the host, readable only
    # through this dedicated gid, deliberately NOT uid/gid 1000, which on
    # Debian/Ubuntu is the first human login account. Adding the gid here as a
    # supplementary group lets this non-root process read the file while
    # granting no host account any access to it. install.sh sets both sides.
    group_add:
      - "${PSSID_SECRET_GID:-61000}"
    volumes:
      # src/ and node_modules are NOT mounted: the image ships the compiled
      # build/ and its own production dependencies. Only genuine runtime state
      # and operator-supplied files are mounted.
      - ./services/server/.env:/usr/src/app/server/.env:ro
      - /usr/lib/exec/pssid:/usr/src/app/server/bin
      - /var/lib/pssid/plugins:/usr/src/app/server/plugins
      - /var/lib/pssid/output:/usr/src/app/server/output
      # Group -> permission mapping, re-read at runtime so it can change without
      # a rebuild. Note this is a SINGLE-FILE mount, which follows the inode: an
      # editor that saves by replacing the file leaves this container reading the
      # old copy, so restart the service after editing (see shared/accessControl.ts).
      - ./shared/auth-groups.config.json:/usr/src/app/server/src/shared/auth-groups.config.json:ro
      - ./certs:/etc/letsencrypt:ro
    expose:
      - "8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      internal:
        aliases:
          - server
  mongo:
    # No cap_drop here, unlike client and server: this image's entrypoint runs as
    # root to chown the data directory and then steps DOWN to the mongodb user,
    # which needs CHOWN, SETUID, SETGID, FOWNER and DAC_OVERRIDE. Dropping them
    # leaves the database unable to start. Same for redis, nginx and certbot.
    <<: *hardened
    # /data/db is the volume below. /data/configdb must also exist and be
    # writable (the image creates it), and mongod puts its unix socket in /tmp.
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    image: ${PSSID_IMAGE_PREFIX:-pssid-gui2}_mongo:${PSSID_IMAGE_TAG:-latest}
    build: ./services/database
    restart: unless-stopped
    logging: *default-logging
    environment:
      # When MONGO_USERNAME/MONGO_PASSWORD are set (the installer generates them),
      # the official image creates this root user on first initialization and
      # enables authentication. Left empty, the database runs without auth, which
      # preserves the previous behavior for a plain `docker compose up`.
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-}
    expose:
      - "27017"
    healthcheck:
      # ping is allowed without authentication, so this works either way.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal
    volumes:
      - mongo_db:/data/db
      # A volume, not tmpfs: the image's entrypoint chowns this path, and under a
      # read-only root it has to exist as a writable mount or mongod will not
      # start. Unused by a standalone deployment, but it must be there.
      - mongo_configdb:/data/configdb

  nginx:
    <<: *hardened
    # The only container reachable from outside the host, so the one where a
    # read-only root matters most. The three tmpfs paths are what nginx was
    # compiled to use: the pid file, and the temp directories for request bodies
    # and proxied responses (nginx -V shows --pid-path and --http-*-temp-path).
    # The image's entrypoint tries to sed /etc/nginx/conf.d/default.conf for IPv6
    # and logs "can not modify ... (read-only file system?)" -- that file is not
    # included by this configuration and the script continues, so it is noise
    # rather than a fault.
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /run:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=16m
    image: nginx:stable-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./www/certbot:/var/www/certbot
    depends_on:
      client:
        condition: service_healthy
      server:
        condition: service_healthy
    networks:
      - internal
      - web

  certbot:
    <<: *hardened
    # Issued certificates go to /etc/letsencrypt, which is a bind mount and stays
    # writable. Its working and log directories are NOT persisted today (nothing
    # mounts them), so backing them with tmpfs changes no behaviour while keeping
    # the rest of the filesystem read-only. noexec is deliberately omitted from
    # the working directory: certbot may place hook scripts there.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/lib/letsencrypt:rw,nosuid,size=32m
      - /var/log/letsencrypt:rw,noexec,nosuid,size=16m
    image: certbot/certbot
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./certs/:/etc/letsencrypt
      - ./www/certbot:/var/www/certbot
    entrypoint: /bin/sh -c
    command: >
      "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot;
        sleep 12h;
      done"

  # Opt-in automated backups. Enable with:  docker compose --profile backup up -d
  # Dumps the gui database to ./mongo-backups on a schedule and prunes old files.
  # Set-and-forget: no host cron, no operator action after enabling.
  backup:
    <<: *hardened
    # Dumps land in /backups, a bind mount. mongodump needs scratch space in /tmp
    # for a large archive.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    image: ${PSSID_IMAGE_PREFIX:-pssid-gui2}_mongo:${PSSID_IMAGE_TAG:-latest}
    profiles:
      - backup
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-24}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
      - MONGO_USERNAME=${MONGO_USERNAME:-}
      - MONGO_PASSWORD=${MONGO_PASSWORD:-}
    volumes:
      - ./mongo-backups:/backups
    entrypoint: /bin/sh -c
    command: >
      "trap exit TERM;
      while :; do
        ts=$$(date +%F-%H-%M);
        if [ -n \"$$MONGO_PASSWORD\" ]; then URI=\"mongodb://$$MONGO_USERNAME:$$MONGO_PASSWORD@mongo:27017/gui?authSource=admin\"; else URI=\"mongodb://mongo:27017/gui\"; fi;
        echo \"[backup] dumping gui -> /backups/backup-$$ts.gz\";
        mongodump --uri=\"$$URI\" --archive=/backups/backup-$$ts.gz --gzip || echo '[backup] dump failed';
        find /backups -name 'backup-*.gz' -mtime +$${BACKUP_RETENTION_DAYS} -delete 2>/dev/null || true;
        sleep $${BACKUP_INTERVAL_HOURS}h;
      done"
    networks:
      - internal

volumes:
  mongo_db:
  # Required by the read-only mongo container; see the mongo service above.
  mongo_configdb:
  redis_data:

networks:
  internal:
    driver: bridge
  web:
