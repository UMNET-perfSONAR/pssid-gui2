# nginx: the only published entry point into the stack.
#
# This is the committed REFERENCE configuration, rendered per-host by install.sh
# (see gen_nginx_https / gen_nginx_http there). Keep the two in step: a hardening
# change made only here reaches nobody, because the installer overwrites this
# file with its own render on every run.

events {}

http {
    # Never advertise the nginx version. It turns a version-specific CVE
    # announcement into a list of hosts worth trying.
    server_tokens off;

    # Slow-request defences. A connection that dribbles out a request body or
    # header a byte at a time occupies a worker for as long as it likes unless it
    # is timed out; these bound that without affecting any real client, whose
    # requests complete in milliseconds. Chosen over limit_conn deliberately:
    # a per-IP connection cap also throttles a whole office behind one NAT
    # address, which trades an availability outage for a marginal gain.
    client_header_timeout 12s;
    client_body_timeout   12s;
    send_timeout          10s;
    keepalive_timeout     30s;

    # Bodies this API accepts are a form's worth of JSON. The server enforces its
    # own 256kb ceiling (BODY_LIMIT) and answers with a JSON 413; this outer cap
    # exists so an oversized upload is dropped at the edge instead of being
    # streamed into the application first.
    client_max_body_size 1m;

    # Volumetric rate limiting, in front of the application's own per-IP limits
    # (services/server/src/services/security.middleware.ts). These are set well
    # ABOVE the application's limits on purpose: they exist to shed a flood
    # before it reaches Node, not to express policy, which belongs in one place.
    limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=2r/s;
    limit_req_status 429;

    # Requests arriving with a Host this deployment does not serve are refused
    # without a response at all (444). Anything reaching here is a scanner
    # walking the address or an attempt to make the application generate links
    # for a hostname its operator never configured.
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
    server {
        listen 443 ssl default_server;
        server_name _;
        # Refuse at the TLS layer, so no certificate for the real hostname is
        # even presented to a client that did not ask for it by name.
        ssl_reject_handshake on;
    }

    server {
        listen 80;
        # The public hostname, plus the loopback names: `https://localhost/api/health`
        # is how install.sh's health poll, the Ansible role's wait,
        # upgrade-controller.sh and the troubleshooting docs all check this stack,
        # and the strict default server above answers an unlisted Host with
        # nothing at all.
        server_name pssid.example.edu localhost 127.0.0.1;

        # `^~`, not a plain prefix: it stops any regex location from taking
        # precedence over this one. A regex beats a plain prefix match in nginx,
        # so the `location ~ /\.` dotfile rule further down would otherwise
        # capture this path (it contains `/.`) and 404 the challenge, silently
        # breaking every certificate renewal.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        # The public hostname, plus the loopback names: `https://localhost/api/health`
        # is how install.sh's health poll, the Ansible role's wait,
        # upgrade-controller.sh and the troubleshooting docs all check this stack,
        # and the strict default server above answers an unlisted Host with
        # nothing at all.
        server_name pssid.example.edu localhost 127.0.0.1;

        ssl_certificate /etc/nginx/certs/live/pssid.example.edu/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/pssid.example.edu/privkey.pem;

        # TLS policy. TLS 1.2 is the floor: 1.0 and 1.1 are deprecated (RFC 8996)
        # and every browser that can run this application supports 1.2 or better.
        # Only forward-secret AEAD suites are offered, so a future compromise of
        # the private key cannot decrypt traffic captured today.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        # Let the client choose. Modern clients order by what their hardware does
        # fastest, and every suite offered above is equally acceptable here.
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        # Session tickets without rotation are a forward-secrecy hole: one ticket
        # key decrypts every session it issued. nginx cannot rotate them, so they
        # are off and the session cache above does the resumption instead.
        ssl_session_tickets off;

        # Content Security Policy. The API server sets one of its own (a much
        # stricter default-src 'none', which is all a JSON API needs); it is
        # hidden below so this stays the single policy a browser sees.
        #   script-src 'self'  - the built bundle emits no inline scripts.
        #   'unsafe-inline' for styles - Vue components bind inline style
        #     attributes and Vuetify injects styles at runtime.
        #   fonts.googleapis.com / fonts.gstatic.com - Material Icons + Poppins.
        #   data: images - the edition layer sets an SVG data: URI favicon.
        # `always` so the header is also sent on error responses.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        # frame-ancestors above is the modern control; this covers a browser old
        # enough to lack it, at no cost.
        add_header X-Frame-Options "DENY" always;
        # Deny the powerful APIs outright rather than leaving them to a per-use
        # permission prompt. This application asks for none of them, so a prompt
        # arriving in it would be evidence of injected content, not a feature.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=(), display-capture=()" always;
        # Sever this document from any window that opened it, so a page that
        # launches this one cannot retain a handle for cross-origin poking.
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # A network configuration tool has nothing to gain from being indexed,
        # and its hostnames and group names are not for a public search cache.
        add_header X-Robots-Tag "noindex, nofollow" always;
        #
        # NOT set here: Strict-Transport-Security. It is added by install.sh only
        # for the Let's Encrypt TLS mode, because HSTS makes a certificate error
        # NON-BYPASSABLE: with the self-signed certificate the installer
        # generates by default, a browser that has seen this header stops
        # offering "Advanced -> Proceed" and locks every user out for the whole
        # max-age, with no server-side way to take it back. With a CA-issued
        # certificate it is safe and wanted:
        #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # nginx is the single authority for the headers it sets above.
        #
        # add_header APPENDS to whatever the upstream sent, and the API server
        # runs helmet, which sets five of these itself. Without hiding them, every
        # /api/ response carried two values of each -- and for X-Frame-Options and
        # Referrer-Policy the two DISAGREED. Browsers do not resolve a conflicting
        # X-Frame-Options consistently and some discard it altogether, so a
        # duplicate is not harmless. Hiding the upstream copy means exactly one of
        # each reaches the browser, and the same one whether a response came from
        # the API or the static bundle. The server sets matching values anyway, so
        # a direct connection that bypasses nginx is still protected.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Strict-Transport-Security;
        # Two Content-Security-Policy headers are enforced as their INTERSECTION,
        # so leaving the API server's `default-src 'none'` in place alongside the
        # policy above would apply "load nothing" to the whole site.
        proxy_hide_header Content-Security-Policy;
        # Never forward an upstream's own identifying headers to the client.
        proxy_hide_header X-Powered-By;

        # Increase proxy buffer sizes
        proxy_busy_buffers_size   512k;
        proxy_buffers             4 512k;
        proxy_buffer_size         256k;

        # Dotfiles are never content. Denying them stops a stray .env, .git or
        # editor backup from being served if one is ever left in a served path.
        location ~ /\. {
            deny all;
            return 404;
        }

        location = /hmr {
            proxy_pass http://client:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Exact match: requests to the root URL (e.g. https://pssid.example.edu/)
        # take priority and are served by the backend.
        location = / {
            proxy_pass http://server:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Catches any request beyond the root URL (e.g. /hosts), served by the client.
        location / {
            proxy_pass http://client:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # One value only. This block used to set $scheme and then override it
            # with a literal `https`, which meant the upstream was told the
            # protocol twice and the second answer was true only by coincidence.
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy backend API
        location /api/ {
            limit_req zone=api_zone burst=40 nodelay;
            proxy_pass http://server:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Provisioning runs Ansible against every probe and has no time limit
            # of its own -- how long it takes is not a constraint here. nginx's
            # DEFAULT proxy_read_timeout is 60s, which would return 504 to the
            # browser part way through while the run carried on server-side:
            # the operator sees a failure, retries, and starts a second run over
            # the first. Wait for the real answer instead.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # The OIDC endpoints. /login and /logout are rate limited: a redirect loop
        # or a script hitting them turns this deployment into a battering ram
        # against the identity provider. /callback is NOT limited -- it is already
        # bound to a single-use state, nonce and PKCE verifier, and a user
        # retrying a failed sign-in must not be locked out of the site.
        location /login {
            limit_req zone=auth_zone burst=10 nodelay;
            proxy_pass http://server:8000/login;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /logout {
            limit_req zone=auth_zone burst=10 nodelay;
            proxy_pass http://server:8000/logout;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /callback {
            proxy_pass http://server:8000/callback;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Provider-initiated (back-channel) logout. Only active when
        # SSO_BACKCHANNEL_LOGOUT=true, but the route has to be proxied
        # unconditionally: without this it falls through to `location /` and is
        # answered by the client container, so the provider's logout token is
        # delivered to a static file server and the session it was meant to end
        # stays alive. It is a server-to-server POST from the provider, so it
        # carries no session cookie and enforces its own token signature.
        location /backchannel-logout {
            proxy_pass http://server:8000/backchannel-logout;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket endpoint
        location /ws/ {
            proxy_pass http://server:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
